name: Daily Tech Joke
on:
  schedule:
    # 8:50 PM PKT (UTC+5) = 15:50 UTC
    - cron: '50 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-joke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run Script
        run: python update_log.py
      - name: Push to Repository
        run: |
          git config --global user.name "Author's-Automated"
          git config --global user.email "150334794+shehryar-92@users.noreply.github.com"
          git add tech_jokes.txt
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Automated Joke Sync"
          git pull --rebase
          git push
